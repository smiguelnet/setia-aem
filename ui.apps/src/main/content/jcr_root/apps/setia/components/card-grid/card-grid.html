<!--/* Card Grid (see docs/04 §8) — all data via the Sling Model */-->
<sly data-sly-use.model="br.com.setia.core.models.CardGridModel"/>
<sly data-sly-test.hasCards="${model.cards.size > 0}"/>

<div class="card-grid ${currentStyle.cssClasses} ${model.gridClass} card-grid--gap-${model.gap}"
     data-sly-test="${hasCards}">
    <div class="card-grid__container">
        <sly data-sly-list.card="${model.cards}">
            <div class="card">
                <div class="card__icon" data-sly-test="${card.icon}">
                    <img src="${card.icon}" alt="${card.title}"/>
                </div>
                <h3 class="card__title">${card.title}</h3>
                <p class="card__description" data-sly-test="${card.description}">${card.description}</p>
                <a class="card__link" href="${card.linkUrl}" data-sly-test="${card.linkUrl}">${card.linkText}</a>
            </div>
        </sly>
    </div>
</div>

<sly data-sly-test="${!hasCards}">
    <div class="cq-placeholder" data-emptytext="${'Card Grid' @ i18n}"></div>
</sly>
