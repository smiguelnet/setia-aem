<!--/* Section Heading — title/subtitle pair (see docs/04 §6) */-->
<sly data-sly-test.level="${properties.headingLevel || 'h2'}"/>
<sly data-sly-test.align="${properties.alignment || 'left'}"/>
<sly data-sly-test.extraClass="${properties.cssClass || ''}"/>

<div class="section-heading section-heading--${align} ${extraClass}" data-sly-test="${properties.title}">
    <h2 class="section-heading__title" data-sly-test="${level == 'h2'}">${properties.title}</h2>
    <h3 class="section-heading__title" data-sly-test="${level == 'h3'}">${properties.title}</h3>
    <h4 class="section-heading__title" data-sly-test="${level == 'h4'}">${properties.title}</h4>
    <p class="section-heading__subtitle" data-sly-test="${properties.subtitle}">${properties.subtitle}</p>
</div>

<sly data-sly-test="${!properties.title}">
    <div class="cq-placeholder" data-emptytext="${'Section Heading' @ i18n}"></div>
</sly>
